name: Build & publish

# Po każdym pushu na main: test symulacji, eksport Windows i Web (artefakty),
# publikacja wersji Web na GitHub Pages. Tag v* tworzy dodatkowo Release z paczkami.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.6"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_ready: ${{ steps.pages.outcome == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Godot + export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-templates

      - name: Download Godot and export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p ~/godot ~/.local/share/godot/export_templates
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot
          curl -sSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz -d /tmp/templates
          mv /tmp/templates/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Import project
        run: ~/godot/godot --headless --path godot --import || true

      - name: Headless simulation test (35 days)
        run: |
          ~/godot/godot --headless --path godot res://scenes/test_run.tscn --quit-after 3000 2>&1 | tee sim.log
          if grep -q "SCRIPT ERROR" sim.log; then echo "Błędy skryptów w symulacji"; exit 1; fi
          grep -q "== KONIEC" sim.log

      - name: Export Windows
        run: |
          mkdir -p export/windows
          ~/godot/godot --headless --path godot --export-release "Windows Desktop" "$PWD/export/windows/Fabryka1892.exe"
          cp README.md export/windows/CZYTAJ.md
          cd export && zip -r Fabryka1892-windows.zip windows

      - name: Export Web
        run: |
          mkdir -p export/web
          ~/godot/godot --headless --path godot --export-release "Web" "$PWD/export/web/index.html"
          touch export/web/.nojekyll
          cd export && zip -r Fabryka1892-web.zip web

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Fabryka1892-${{ github.sha }}
          path: |
            export/Fabryka1892-windows.zip
            export/Fabryka1892-web.zip
          retention-days: 30

      # Publikacja na GitHub Pages wymaga jednorazowego włączenia w Settings → Pages
      # (Source: GitHub Actions). Dopóki to nie nastąpi, krok tylko ostrzega, a paczki i tak powstają.
      - name: Setup Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: export/web

      - name: Release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            export/Fabryka1892-windows.zip
            export/Fabryka1892-web.zip
          generate_release_notes: true

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.outputs.pages_ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
